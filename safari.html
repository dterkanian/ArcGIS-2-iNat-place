<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Taxa</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f5f5f5;
        }

        #taxa {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .taxon-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        .taxon-card h2 {
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 24px;
        }

        .scientific-name {
            font-style: italic;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .native-status {
            font-size: 14px;
            margin-bottom: 15px;
        }

        .resources h3 {
            margin-bottom: 5px;
            font-size: 16px;
        }

        .resources ul {
            margin-top: 5px;
            padding-left: 25px;
        }

        .resources li {
            margin-bottom: 5px;
        }

        .photos {
            margin-top: 20px;
        }

        .photos h3 {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .photo {
            min-width: 0;
        }

        .photo a {
            display: block;
        }

        .photo img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 5px;
        }

        .attribution {
            display: block;
            margin-top: 4px;
            font-size: 11px;
            line-height: 1.3;
            color: #555;
        }

        .attribution a {
            color: inherit;
        }

        @media (max-width: 700px) {
            #taxa {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>Taxa</h1>

    <div id="taxa"></div>


    <script>

        // Load taxa.json
        fetch("taxa.json")
            .then(response => {

                if (!response.ok) {
                    throw new Error("Could not load taxa.json");
                }

                return response.json();
            })

            .then(taxa => {

                // Separate native and non-native taxa
                const nativeTaxa =
                    taxa.filter(taxon => taxon.native === true);

                const nonNativeTaxa =
                    taxa.filter(taxon => taxon.native === false);


                // Pick 3 native taxa
                const selectedNative =
                    getRandomItems(nativeTaxa, 3);

                // Pick 1 non-native taxon
                const selectedNonNative =
                    getRandomItems(nonNativeTaxa, 1);


                // Combine the results
                const selectedTaxa = [
                    ...selectedNative,
                    ...selectedNonNative
                ];


                // Display the cards
                displayTaxa(selectedTaxa);

            })

            .catch(error => {
                console.error(error);

                document.getElementById("taxa").innerHTML =
                    `<p>Error loading taxa.json: ${error.message}</p>`;
            });



        // --------------------------------------------------
        // Return a specified number of random items
        // --------------------------------------------------

        function getRandomItems(array, number) {

            const shuffled = [...array]
                .sort(() => Math.random() - 0.5);

            return shuffled.slice(0, number);
        }



        // --------------------------------------------------
        // Display the taxa
        // --------------------------------------------------

        function displayTaxa(taxa) {

            const container =
                document.getElementById("taxa");

            container.innerHTML = "";


            taxa.forEach(taxon => {

                const card =
                    document.createElement("div");

                card.className = "taxon-card";


                // ------------------------------------------
                // iNaturalist taxon URL
                // ------------------------------------------

                const inaturalistUrl =
                    `https://www.inaturalist.org/taxa/${taxon.taxon_id}`;


                // ------------------------------------------
                // Photos
                // ------------------------------------------

                let photosHTML = "";

                if (taxon.photos && taxon.photos.length > 0) {

                    photosHTML = taxon.photos
                        .map(photo => {

                            return `
                                <div class="photo">

                                    <a href="${photo.url}"
                                       target="_blank"
                                       rel="noopener noreferrer">

                                        <img
                                            src="${photo.url}"
                                            alt="${taxon.preferred_common_name || taxon.name}"
                                        >

                                    </a>

                                    <span class="attribution">
                                        <a href="${photo.url}"
                                           target="_blank"
                                           rel="noopener noreferrer">
                                            ${photo.attribution}
                                        </a>
                                    </span>

                                </div>
                            `;

                        })
                        .join("");
                }


                // ------------------------------------------
                // Card
                // ------------------------------------------

                card.innerHTML = `

                    <h2>
                        ${taxon.preferred_common_name || "Unknown"}
                    </h2>


                    <div class="scientific-name">
                        ${taxon.name}
                    </div>


                    <div class="native-status">
                        ${taxon.native ? "Native" : "Non-native"}
                    </div>


                    <div class="resources">

                        <h3>Identification resources</h3>

                        <ul>

                            <li>
                                <a href="${inaturalistUrl}"
                                   target="_blank"
                                   rel="noopener noreferrer">
                                    iNaturalist
                                </a>
                            </li>

                            ${
                                taxon.wikipedia_url
                                ? `
                                    <li>
                                        <a href="${taxon.wikipedia_url}"
                                           target="_blank"
                                           rel="noopener noreferrer">
                                            Wikipedia
                                        </a>
                                    </li>
                                  `
                                : ""
                            }

                        </ul>

                    </div>


                    ${
                        photosHTML
                        ? `
                            <div class="photos">

                                <h3>Photos</h3>

                                <div class="photo-grid">
                                    ${photosHTML}
                                </div>

                            </div>
                          `
                        : ""
                    }

                `;


                container.appendChild(card);
            });
        }

    </script>

</body>

</html>
